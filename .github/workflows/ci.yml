name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs every gate that used to only exist as "run this by hand before
# committing" (see the verification notes in recent commit messages): lint,
# type-check/build, the mcp-server component tests, both packages' protocol
# smoke tests, and the browser-bridge rendering test. ubuntu-latest ships a
# working Docker daemon, so mcp-server's smoke test gets real Stage 1/2/5
# coverage here that a Docker-less environment can't provide — Stage 4's
# container-lifecycle checks still skip gracefully (see test/smoke.ts),
# since they additionally need the local/sleeper:test image SKILL.md
# describes building manually; provisioning that image in CI is a separate,
# not-yet-done piece of work, not something this workflow papers over.
jobs:
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Component tests (React UI layer)
        run: npm run test:ui
      - name: Build + protocol/Docker smoke test
        run: npm run smoke

  browser-bridge:
    runs-on: ubuntu-latest
    needs: mcp-server
    defaults:
      run:
        working-directory: browser-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            browser-bridge/package-lock.json
            mcp-server/package-lock.json

      - name: Build mcp-server (browser-bridge's smoke/e2e tests wrap it)
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      - run: npm ci
      - run: npm run lint
      - name: Build + protocol smoke test
        run: npm run smoke
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Rendering test (real browser, real bridge, real tool call)
        run: npm run test:e2e
