<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCP Apps Browser Bridge</title>
<style>
  html, body { height: 100%; margin: 0; background: #1e1e1e; color: #e6e6e6; font-family: system-ui, sans-serif; }
  #status { padding: 8px 14px; font-size: 13px; background: #252525; border-bottom: 1px solid #383838; display: flex; align-items: center; gap: 8px; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0ad4e; }
  #status.ready .dot { background: #5cb85c; }
  #status.error .dot { background: #d9534f; }
  #frame-wrap { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #error { padding: 16px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; color: #ff8080; }
</style>
</head>
<body>
  <div id="status"><span class="dot"></span><span id="status-text">Connecting to MCP server…</span></div>
  <div id="frame-wrap"></div>
  <script id="bridge-session" type="application/json">"__BRIDGE_SESSION__"</script>
  <script type="module" src="./main.ts"></script>
</body>
</html>
