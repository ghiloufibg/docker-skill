<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Docker Fleet Dashboard</title>
</head>
<body>
  <main class="main">
    <header class="header">
      <h1 class="title">Docker Fleet</h1>
      <button id="refresh-btn" class="btn">Refresh</button>
    </header>

    <div id="empty-state" class="empty-state" hidden>No containers found.</div>
    <div id="fleet-status" class="actions-status" hidden></div>
    <div id="card-list" class="card-list"></div>

    <section id="detail-panel" class="detail-panel" hidden>
      <div class="detail-header">
        <h2 id="detail-title" class="detail-title">--</h2>
        <button id="detail-close-btn" class="btn btn-small">Close</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="inspect">Inspect</button>
        <button class="tab-btn" data-tab="logs">Logs</button>
        <button class="tab-btn" data-tab="stats">Stats</button>
        <button class="tab-btn" data-tab="actions">Actions</button>
      </div>

      <div id="tab-inspect" class="tab-panel">
        <dl id="detail-body" class="detail-body"></dl>
      </div>

      <div id="tab-logs" class="tab-panel" hidden>
        <div class="tab-toolbar">
          <button id="logs-refresh-btn" class="btn btn-small">Refresh</button>
          <label class="live-toggle">
            <input type="checkbox" id="logs-live-toggle">
            Live
          </label>
        </div>
        <div id="logs-live-status" class="stats-status" hidden></div>
        <pre id="logs-content" class="logs-content">--</pre>
      </div>

      <div id="tab-stats" class="tab-panel" hidden>
        <div class="tab-toolbar">
          <button id="stats-refresh-btn" class="btn btn-small">Refresh</button>
          <label class="live-toggle">
            <input type="checkbox" id="stats-live-toggle">
            Live
          </label>
        </div>
        <div id="stats-status" class="stats-status" hidden></div>
        <div id="stats-data">
          <div class="bar-section">
            <div class="bar-label"><span>CPU</span><span id="stats-cpu-percent">--%</span></div>
            <div class="bar"><div id="stats-cpu-bar" class="bar-fill"></div></div>
          </div>
          <div class="bar-section">
            <div class="bar-label"><span>Memory</span><span id="stats-mem-percent">--%</span></div>
            <div class="bar"><div id="stats-mem-bar" class="bar-fill"></div></div>
            <div id="stats-mem-detail" class="bar-detail">-- / --</div>
          </div>
          <div class="stats-row">
            <span>Net RX <span id="stats-net-rx">--</span></span>
            <span>Net TX <span id="stats-net-tx">--</span></span>
            <span>PIDs <span id="stats-pids">--</span></span>
          </div>
          <svg id="stats-sparkline" class="sparkline" viewBox="0 0 200 48" preserveAspectRatio="none" hidden>
            <polyline id="sparkline-cpu" class="sparkline-cpu" points=""></polyline>
            <polyline id="sparkline-mem" class="sparkline-mem" points=""></polyline>
          </svg>
          <div id="sparkline-legend" class="sparkline-legend" hidden>
            <span class="sparkline-legend-cpu">CPU</span>
            <span class="sparkline-legend-mem">Memory</span>
          </div>
        </div>
      </div>

      <div id="tab-actions" class="tab-panel" hidden>
        <p class="actions-tier-note">
          Tier 1 actions (Start/Restart/Pause/Unpause) ask for a simple confirm.
          Tier 2 actions (Stop/Kill/Remove) require typing the container name —
          see design doc §4/§9.
        </p>
        <div class="actions-group">
          <h3 class="actions-group-title">Tier 1</h3>
          <div id="actions-tier1" class="actions-buttons"></div>
        </div>
        <div class="actions-group">
          <h3 class="actions-group-title">Tier 2</h3>
          <div id="actions-tier2" class="actions-buttons"></div>
        </div>
        <div id="actions-status" class="actions-status" hidden></div>
      </div>
    </section>

    <div id="confirm-overlay" class="confirm-overlay" hidden>
      <div class="confirm-dialog">
        <h3 id="confirm-title" class="confirm-title">--</h3>
        <p id="confirm-body" class="confirm-body">--</p>
        <div id="confirm-type-wrap" class="confirm-type-wrap" hidden>
          <label for="confirm-type-input" id="confirm-type-label" class="confirm-type-label">
            Type the container name to confirm:
          </label>
          <input id="confirm-type-input" class="confirm-type-input" type="text" autocomplete="off">
        </div>
        <div class="confirm-actions">
          <button id="confirm-cancel-btn" class="btn btn-small">Cancel</button>
          <button id="confirm-ok-btn" class="btn btn-small btn-danger" disabled>Confirm</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./src/docker-dashboard.ts"></script>
</body>
</html>
